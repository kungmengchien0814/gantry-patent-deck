<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE  期末專利報告，口頭簡報輔助：清楚、可信、一步一個重點
   IDEA   一座會「上熱下冷」的龍門，跟著講稿一步步加上感測器、水冷板與控制
   PICTURE 右側 3D 龍門（溫度色、變形放大、水路流動），第 8 頁是雙門檻控制模擬
   COLOUR 沿用原 pptx：暖白底 #f4f3ef、深藍 #16222e、橘 #e8722c；冷用藍 #2f7dc0
   TYPE / LAYOUT  Noto Sans TC + Roboto Mono；版面與 AEM 互動簡報相同（1600×900 舞台） */
:root{
  --bg:#f4f3ef; --ink:#16222e; --muted:#5d6873; --line:#d8d3c8; --blue:#1d4f7c; --blue2:#9dbad6; --cold:#2f7dc0;
  --accent:#e8722c; --acc2:#fde9da; --deep:#a8440f; --navy:#16222e; --green:#2f7d4a; --red:#b8321a; --panel:rgba(255,255,255,.9);
  --mono:"Roboto Mono",Consolas,monospace;
  --ez:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e151c;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink)}
#stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;background:radial-gradient(ellipse at 70% 40%,#fbfaf6 0%,var(--bg) 72%);overflow:hidden;transform-origin:center center;user-select:none}

/* ---------- 版面方框 ---------- */
.box{position:absolute;background:var(--panel);border:1.5px solid #d6d0c4;border-radius:12px;overflow:hidden;
  transition:left .8s var(--ez),top .8s var(--ez),width .8s var(--ez),height .8s var(--ez),opacity .45s,border-color .45s,background .45s;
  box-shadow:0 6px 22px rgba(22,34,46,.06)}
#hdr{left:40px;top:24px;width:860px;height:112px;padding:16px 28px 0 30px;border-left:6px solid var(--accent)}
#kick{font-size:15px;letter-spacing:.12em;color:var(--deep);font-weight:500;white-space:nowrap;font-family:var(--mono)}
#ttl{margin-top:6px;font-size:36px;font-weight:900;line-height:1.2;white-space:nowrap}
#pgb{position:absolute;right:18px;top:14px;font-family:var(--mono);font-size:13px;color:#7d8790;border:1px solid #d6d0c4;border-radius:4px;padding:2px 8px;background:#fff}
#content{left:40px;top:152px;width:860px;height:600px;padding:26px 34px}
#model{left:920px;top:24px;width:640px;height:544px;background:radial-gradient(ellipse at 50% 42%,#ffffff 0%,#f3f1ec 82%)}
#mview{position:absolute;inset:0}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#lbl{position:absolute;inset:0;pointer-events:none}
#lbl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#mtag{position:absolute;left:16px;bottom:10px;font-size:15px;color:#7d8790;pointer-events:none;letter-spacing:.04em;z-index:3}
#mtag b{color:var(--accent);font-weight:700}
#param{left:920px;top:584px;width:640px;height:168px;padding:14px 20px}
#say{position:absolute;left:40px;right:40px;top:768px;height:56px;display:flex;align-items:center;gap:14px;z-index:6;pointer-events:none}
#say .no{font-family:var(--mono);font-size:14px;color:#fff;background:var(--accent);border-radius:20px;padding:5px 12px;white-space:nowrap}
#say .tx{flex:1;font-size:21px;line-height:1.4;color:#1d2a35;background:rgba(255,255,255,.94);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:9px 16px;box-shadow:0 4px 14px rgba(22,34,46,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
#dots{display:flex;gap:6px;flex-wrap:nowrap}
#dots b{width:10px;height:10px;border-radius:50%;background:#d3cdc1}
#dots b.on{background:var(--accent)} #dots b.done{background:#efb48c}

/* ---------- 版面模式 ---------- */
#stage.L-wide #hdr{width:540px}
#stage.L-wide #ttl{font-size:30px;margin-top:10px}
#stage.L-wide #content{width:540px}
#stage.L-wide #model{left:600px;width:960px}
#stage.L-wide #param{left:600px;width:960px}
#stage.L-flat #hdr{width:1520px}
#stage.L-flat #content{width:1520px}
#stage.L-flat #model{left:1640px;opacity:0}
#stage.L-flat #param{left:1640px;opacity:0}
#stage.L-cover #hdr{opacity:0;top:-140px}
#stage.L-cover #content{top:40px;height:712px;width:800px;background:transparent;border-color:transparent;box-shadow:none;padding:70px 30px 0 44px}
#stage.L-cover #model{left:760px;top:30px;width:820px;height:730px;background:transparent;border-color:transparent;box-shadow:none}
#stage.L-cover #param{top:930px;opacity:0}

/* ---------- 內容排版 ---------- */
.ci{height:100%;display:flex;flex-direction:column;gap:16px;font-size:25px;line-height:1.55;animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-s]{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s,background .35s,border-color .35s,filter .35s}
[data-s].vis{opacity:1;transform:none}
.pt{border-left:4px solid var(--blue2);padding:4px 0 4px 16px;transition:border-color .35s,background .35s}
.pt b{display:block;font-size:26px;font-weight:700;color:var(--blue);line-height:1.35}
.pt span{display:block;font-size:21px;color:#3b4853;line-height:1.55}
.pt.on{border-left-color:var(--accent);background:linear-gradient(90deg,var(--acc2),rgba(253,233,218,0))}
.pt.on b{color:var(--deep)}
.lead{font-size:26px;font-weight:700;line-height:1.45}
.lead em{font-style:normal;color:var(--accent)}
.note{font-size:16.5px;color:var(--muted);line-height:1.55}
.warn{font-size:19px;color:#7a3a10;background:#fff4ea;border:1px solid #f0c7a3;border-radius:8px;padding:10px 14px;line-height:1.5}
.warn b{color:var(--deep)}
.mono{font-family:var(--mono)}
.row{display:flex;gap:22px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.grow{flex:1;min-height:0}
.fig{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.fig .im{flex:1;min-height:0;background:#fff;border:1px solid #ddd7cb;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.fig img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.fig .cap{font-size:16px;color:var(--muted);line-height:1.4}
.fig .cap b{color:var(--ink)}
.pm{font-style:normal;font-family:var(--mono);font-weight:700;font-size:1.02em;color:var(--deep);background:var(--acc2);border-radius:5px;padding:0 6px;margin:0 1px;white-space:nowrap}
.chip{display:inline-block;font-size:15px;border:1px solid #c9c2b5;border-radius:20px;padding:0 10px;margin-right:6px;background:#fff;color:#3b4853;vertical-align:middle;line-height:1.6;white-space:nowrap}
.chip.a{border-color:var(--accent);color:var(--deep);background:var(--acc2)}
.chip.n{border-color:var(--navy);color:#fff;background:var(--navy)}

/* 卡片 */
.cards{display:grid;gap:16px}
.card{background:#fcfbf8;border:1.5px solid #e1dbcf;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:border-color .35s,box-shadow .35s,background .35s,opacity .35s}
.card .n{font-family:var(--mono);font-size:14.5px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.card b{font-size:24px;color:var(--ink);line-height:1.3}
.card span{font-size:19px;color:#46535e;line-height:1.55}
.card.on{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,114,44,.15);background:#fffaf5}
.card.dk{background:var(--navy);border-color:var(--navy)}
.card.dk b{color:#fff}.card.dk span{color:#c9d2da}.card.dk .n{color:#f6a26b}
.card.dk.on{box-shadow:0 0 0 4px rgba(232,114,44,.3)}
.card .lim{margin-top:auto;border-top:1px solid #e6e0d4;padding-top:10px;font-size:17.5px;color:#3d6a96;line-height:1.5;transition:color .35s}
.card .lim.on{color:var(--deep);font-weight:700}
.card .ic{width:46px;height:46px;margin-bottom:4px}
.gapc{background:#fff3ea;border:1.5px solid #f1c4a4;border-radius:12px;padding:16px 22px;display:flex;flex-direction:column;gap:6px}
.gapc b{font-size:24px;color:var(--ink)}
.gapc span{font-size:20px;color:#4a3a30}

/* 表格 */
.tb{width:100%;border-collapse:collapse;font-size:20px;background:#fff;border-radius:10px;overflow:hidden}
.tb th,.tb td{padding:9px 14px;border-bottom:1px solid #e3ded4;text-align:left;transition:background .35s,color .35s,opacity .35s;line-height:1.45;vertical-align:middle}
.tb th{font-size:16px;color:#fff;font-weight:700;background:var(--navy);line-height:1.35}
.tb td.n,.tb .mono{font-family:var(--mono)}
.tb.tight td{padding:6px 14px}.tb.tight th{padding:8px 14px}
.cards.mk .card{padding:18px 20px;gap:8px}.cards.mk .card b{font-size:26px}.cards.mk .card span{font-size:20.5px}.cards.mk .card .lim{font-size:19px}
.tb tr.on td{background:#ffe9d6}
.tb tr.on td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.tb td.on{background:#fff1e4;color:#9a4a0c;font-weight:700}
.tb th.me{background:var(--deep)}
.tb td.me{background:#fff4ec}
.tb.mx td{text-align:center;padding:9px 8px}
.tb.mx td:first-child{text-align:left;font-weight:700;font-size:21px;padding-left:16px}
.tb.mx th{text-align:center}.tb.mx th:first-child{text-align:left;padding-left:16px}
.sy{display:block;font-size:29px;line-height:1.05;font-weight:700}
.sy small{display:block;font-size:15.5px;font-weight:400;color:var(--muted);margin-top:3px;line-height:1.25}
.sy.o{color:var(--ink)}.sy.t{color:#b07a1a}.sy.x{color:#a0a8b0}.sy.d{color:#b9bfc5}
td.me .sy{color:var(--accent)}td.me .sy small{color:var(--deep);font-weight:700}

/* 封面 */
.cv-k{font-size:17px;letter-spacing:.16em;color:var(--deep);font-weight:500}
.cv h1{font-size:62px;font-weight:900;line-height:1.2;margin-top:22px}
.cv h1 em{font-style:normal;color:var(--accent)}
.cv .s{font-size:26px;color:#46535e;margin-top:22px;line-height:1.6}
.cv .a{font-size:20px;color:#3b4853;margin-top:26px;line-height:1.7}
.howto{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px;max-width:620px}
.howto span{font-size:15px;color:#46535e;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:6px;padding:6px 11px}
.howto b{color:var(--accent);margin-right:6px}
.recap{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.recap div{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:baseline;font-size:21px;line-height:1.5;color:#33414c}
.recap i{font-style:normal;font-size:16px;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:3px 0;text-align:center}

/* ---------- 參數面板 ---------- */
#param{display:flex;flex-direction:column;gap:8px}
#ro{display:flex;gap:10px}
#ro:empty{display:none}
#ro .r{flex:1;min-width:0;border-right:1px solid #e6e1d7;padding-right:8px}
#ro .r:last-child{border-right:0}
#ro .l{font-size:13px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ro .v{font-family:var(--mono);font-size:22px;font-weight:500;color:#1d2a35;line-height:1.2;white-space:nowrap}
#ro .v small{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
#ro .r.hi .v{color:var(--accent);font-weight:700}
#pc{font-size:17px;line-height:1.55;color:#33414c;flex:1;min-height:0}
#pc b{color:var(--blue)}
#pc .ci{font-size:inherit;line-height:inherit;gap:6px;animation:none}
#pc .lg{display:flex;flex-wrap:wrap;gap:4px 18px}
#pc .lg span{display:flex;align-items:center;gap:8px}
#pc .lg i{display:inline-block;width:24px;height:10px;border-radius:3px}
.tgrad{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.tgrad i{height:12px;border-radius:3px;background:linear-gradient(90deg,#2f7dc0,#c9c2bd,#e5702e)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px}
.pgrid div{border-left:3px solid var(--accent);padding-left:9px}
.pgrid small{display:block;font-size:13px;color:var(--muted)}
.pgrid b{font-family:var(--mono);font-size:18px;color:var(--ink)!important;white-space:nowrap}
#mbtn{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;gap:6px}
#mbtn button{font:inherit;font-size:14px;border:1px solid #c9c2b5;background:rgba(255,255,255,.94);color:#22303b;border-radius:6px;padding:5px 11px;cursor:pointer}
#mbtn button:hover{border-color:var(--accent)}
#mbtn button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#ctrl{display:none}

/* ---------- 標籤 ---------- */
.tag{position:absolute;background:rgba(255,255,255,.96);border:1px solid #9aa6b0;border-radius:3px;padding:3px 8px;font-size:14.5px;line-height:1.35;color:#1d2a35;white-space:nowrap;transition:opacity .35s;box-shadow:0 2px 8px rgba(22,34,46,.08)}
.tag small{display:block;font-size:12px;color:#5b6772}
.tag.hot{border-color:var(--accent);color:#9a4a0c}
.tag.cold{border-color:var(--cold);color:#1d5b93}

/* ---------- 進度路線 ---------- */
#route{position:absolute;left:0;right:0;top:834px;height:66px;z-index:4;pointer-events:none}
#route .ln{position:absolute;left:80px;right:250px;top:30px;height:2px;background:#cfc9bd}
#route .prog{position:absolute;left:80px;top:30px;height:2px;background:var(--accent);transition:width .6s}
#route .st{position:absolute;top:20px;transform:translateX(-50%);text-align:center}
#route .st b{display:block;width:21px;height:21px;line-height:17px;border-radius:50%;background:#fff;border:2px solid #a9a295;margin:0 auto;font-size:11.5px;font-weight:700;font-family:var(--mono);color:#6b7480}
#route .st span{position:absolute;left:50%;top:25px;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:#7d8790}
#route .st.past b{background:#efb48c;border-color:#efb48c;color:#7a3d12}
#route .st.cur b{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(232,114,44,.18)}
#route .st.cur span{color:var(--accent);font-weight:700;font-size:14px}
#route .st.wait span{visibility:hidden}

#tools{position:absolute;right:20px;top:848px;z-index:7;display:flex;gap:6px}
#tools button{border:1px solid #c9c2b5;background:rgba(255,255,255,.92);border-radius:6px;width:32px;height:28px;cursor:pointer;font-size:15px;color:#33414c}
#tools button:hover{border-color:var(--accent)}
#tools button.tx{width:auto;padding:0 10px;font-family:inherit;font-size:14px;font-weight:500}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:20;transition:opacity .22s}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:var(--bg);font-size:22px;color:#7a2f12;text-align:center;line-height:1.8}
#stage.notr .box,#stage.notr [data-s]{transition:none!important}
#stage.notr .ci{animation:none!important}

/* 章節帶入 */
#chap{position:absolute;inset:0;z-index:30;display:none;pointer-events:none}
#chap .bg{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .45s}
#chap .ck{position:absolute;left:0;right:0;top:322px;text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.35em;color:var(--accent);opacity:0;transition:opacity .35s}
#chap .cl{position:absolute;left:640px;width:320px;top:560px;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .3s}
#chap .cn{position:absolute;left:800px;top:450px;font-size:112px;font-weight:900;letter-spacing:.04em;color:var(--ink);white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(1.06);transition:transform .45s ease-out,opacity .45s}
#chap.in .bg{opacity:1}#chap.in .ck{opacity:1}#chap.in .cl{transform:scaleX(1)}#chap.in .cn{opacity:1;transform:translate(-50%,-50%) scale(1)}
#chap.fly .bg{opacity:0;transition:opacity .6s}#chap.fly .ck,#chap.fly .cl{opacity:0}
#chap.fly .cn{transition:transform .75s cubic-bezier(.65,0,.25,1),color .75s}

/* 請求項 */
.claim{background:#fcfbf8;border:1.5px solid #e1dbcf;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.claim p{font-size:19px;line-height:1.55;color:#2f3c47;border-radius:6px;padding:2px 8px;transition:background .35s,color .35s,box-shadow .35s}
.claim p.el{margin-left:30px}
.claim p.pre{font-weight:700;color:var(--ink)}
.claim p.on{background:#fff1e4;box-shadow:inset 4px 0 0 var(--accent);color:#1d2a35}
.claim .hl{color:var(--deep);font-weight:700}
.claim u{text-decoration:none;border-bottom:2px solid var(--accent)}
.anat{display:flex;gap:8px;align-items:center;font-size:17.5px;color:#33414c;flex-wrap:wrap}
.anat i{font-style:normal;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:3px 12px}
.anat i.a{background:var(--deep)}

/* 流程圖 */
.flow{position:relative;height:345px}
.flow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fx{position:absolute;width:176px;height:90px;border:2px solid #b9b2a5;background:#fff;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;transition:background .25s,border-color .25s,box-shadow .25s,transform .25s}
.fx b{font-family:var(--mono);font-size:15px;color:var(--deep)}
.fx span{font-size:16.5px;line-height:1.3;color:#22303b}
.fx.q{border-color:#e7a37a;border-style:solid}
.fx.live{background:#fff1e4;border-color:var(--accent);box-shadow:0 0 0 5px rgba(232,114,44,.2);transform:scale(1.04)}
.fl{font-size:15px;fill:#5d6873;font-weight:700}
.fa{fill:none;stroke:#7d8790;stroke-width:2}
.th2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.th2 div{background:#fcfbf8;border:1.5px solid #e1dbcf;border-radius:10px;padding:10px 16px;font-size:18px;line-height:1.5;color:#3b4853}
.th2 b{display:block;font-size:21px;color:var(--ink)}
.th2 .pm{font-size:20px}

/* 預期功效 */
.eff{display:flex;flex-direction:column;gap:14px}
.eff div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-size:22px;line-height:1.45;color:#26333e}

<script type="module">

const HOTE = new THREE.Color('#e8722c');

const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 900);

const controls = new OrbitControls(camera, glc);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.rotateSpeed = 0.7; controls.autoRotateSpeed = 0.8;

let K = 1, PR = 1, VW = 0, VH = 0, VPR = 0;
function fit() {

/* ================= 小工具 ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const fmt = (v, d = 2) => (Math.abs(v) < 1e-12 ? 0 : v).toFixed(d);
const V3 = a => new THREE.Vector3(...a);
const match = (n, list) => list.some(f => f.endsWith('*') ? n.startsWith(f.slice(0, -1)) : n === f);

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;

/* ================= 零件系統（聚焦 / 高亮） ================= */
function part(S, name, { pos = [0, 0, 0], ex = [0, 0, 0], eg = 'main' } = {}) {
  const root = new THREE.Group(), spin = new THREE.Group(); root.add(spin); root.position.set(...pos); S.world.add(root);
  const p = { name, root, spin, base: V3(pos), ex: V3(ex), eg, mats: [], vis: 1, visT: 1, hot: 0, hotT: 0 };
  S.parts[name] = p; if (!S.egs.includes(eg)) S.egs.push(eg); return p;
}
function addMesh(p, geo, color, o = {}) {
  const fill = new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: o.op ?? 0.96, metalness: o.metal ?? 0.15, roughness: o.rough ?? 0.55,
    side: o.side ?? THREE.FrontSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, map: o.map || null,
    vertexColors: !!o.vc, emissive: '#000000'
  });
  const mesh = new THREE.Mesh(geo, fill);

  const rec = { fill, base: new THREE.Color(color), op: fill.opacity, noDepth: !!o.noDepth, glow: o.glow ?? .45 };
  if (o.noDepth) { fill.depthWrite = false; mesh.renderOrder = 2; }
  if (o.edges !== false) {
    const lg = new THREE.EdgesGeometry(geo, o.ang ?? 30);
    const lm = new THREE.LineBasicMaterial({ color: o.edge || C.edge, transparent: true, opacity: o.eop ?? 0.7 });
    mesh.add(new THREE.LineSegments(lg, lm));
    rec.line = lm; rec.lbase = new THREE.Color(o.edge || C.edge); rec.lop = lm.opacity;

}
function addObj(p, obj, mat, color, op = 1) {
  p.spin.add(obj);
  const rec = mat.isLineBasicMaterial || mat.isLineDashedMaterial ? { line: mat, lbase: new THREE.Color(color), lop: op } : { fill: mat, base: new THREE.Color(color), op };
  p.mats.push(rec); return obj;

function boxG(x0, x1, y0, y1, z0, z1, sx = 1, sy = 1, sz = 1) {

/* 方塊外框：每條邊細分，變形時才會跟著彎 */
function boxLines(x0, x1, y0, y1, z0, z1, n = 20) {
  const c = i => [i & 1 ? x1 : x0, i & 2 ? y1 : y0, i & 4 ? z1 : z0], out = [];
  for (const [a, b] of [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]]) {

const IMG = { tilt: 'img/tilt.jpg', g8: 'img/g8.png', g23: 'img/g23.png', fig: 'img/fig_system.png' };

/* =====================================================================
   場景：龍門（示意，比例大致參考論文 COMSOL 模型；單位 1 = 100 mm，z 朝上，正面朝 −y）
   橫樑 x −17～17、z 17.5～23.5；立柱中心 x ±8.25、寬 4、高 17.5
   ===================================================================== */
const XC = 8.25, ZB = 17.5, HB = 17;
/* 變形示意（大幅放大）：上熱 → 橫樑伸長並上拱，立柱頂端被往外推 */
function deform(x, y, z, a) {
  if (!a) return [x, y, z];
  if (Math.abs(x) < 2.3 && z > 10 && y < -2.8) return [x, y, z + a * 1.1];
  if (z >= ZB - .01) { const u = clamp(x / HB, -1, 1); return [x + a * .12 * x, y, z + a * 1.1 * (1 - u * u)]; }
  const s = clamp(z / ZB, 0, 1), sx = Math.sign(x) || 1, u = XC / HB;
  return [x + a * .12 * sx * XC * s * s, y, z + a * 1.1 * (1 - u * u) * s];
}
const GA = new THREE.Color('#2f7dc0'), GM = new THREE.Color('#cfc8c2'), GB = new THREE.Color('#ee6c22'), STEEL = new THREE.Color('#c3cad0');
const tc = new THREE.Color(), tc2 = new THREE.Color();

  const s = Math.pow(clamp(z / 23.5, 0, 1), .85), u = clamp(.5 + (s - .5) * g, 0, 1);
  if (u < .5) tc.copy(GA).lerp(GM, u * 2); else tc.copy(GM).lerp(GB, (u - .5) * 2);
  return tc2.copy(STEEL).lerp(tc, f);
}
function defBox(S, p, b, seg) {
  const g = boxG(...b, ...seg);
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 3).fill(1), 3));

  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(boxLines(...b, 24), 3));
  const lm = new THREE.LineBasicMaterial({ color: C.edge, transparent: true, opacity: .75 });
  const ls = new THREE.LineSegments(lg, lm); ls.frustumCulled = false; addObj(p, ls, lm, C.edge, .75);
  S.defs.push({ g, p0: g.attributes.position.array.slice(), vc: true }, { g: lg, p0: lg.attributes.position.array.slice() });

function applyDeform(S) {
  const a = S.params.tilt, f = S.params.field, gg = S.params.dT;
  const key = a.toFixed(4) + '|' + f.toFixed(3) + '|' + gg.toFixed(3);

      for (let i = 0; i < arr.length; i += 3) { const c = tempColor(p0[i + 2], f, gg); col[i] = c.r; col[i + 1] = c.g; col[i + 2] = c.b; }

/* ---------- 控制邏輯示意（數值為設定的示意值，非實測） ---------- */

  }

  const th = S.params.mode === 1 ? line(.3, '門檻 0.3', '#a8440f') : line(.3, '啟動 0.3', '#a8440f') + line(.1, '停止 0.1', '#2f7dc0');

const NOTES = [{"slide": 1, "secs": 50, "script": "各位老師、同學好，我們是四智四丙的龔孟謙、周大凱、鄭楷諺、陳宣佑。\n我們這組的期末專利題目是「龍門加工機之溫差式均溫系統及其方法」。先解釋一下題目：「溫差式」是說我們用龍門上下的溫度差來做控制；「系統及其方法」代表我們同時保護裝置本身和控制方法，所以申請的是發明專利。\n右邊這張圖就是我們要解決的問題：龍門加工機上面熱、下面冷。接下來先說明我們為什麼選這個題目。", "qa": ["題材來源？→ 屬白板第②種「研討會」，來自本組 CSME2025 論文 B15-004。", "為什麼申請發明，不申請新型？→ 要保護控制方法和參數範圍，新型只保護形狀、構造，不能保護方法；新型不做實質審查、約 3–6 個月有結果，發明要實質審查、約 1–3 年（11/17 板書）。", "論文已經公開，還有新穎性嗎？→ 發明專利在自己公開後 12 個月內申請，可主張優惠期；論文 2025/12/5 公開，期限約到 2026/12/5。"], "memo": ["發明人學號：3B261084 龔孟謙、3B261086 周大凱、3B261117 鄭楷諺、3B261097 陳宣佑。發明專利寫「發明人」，新型寫「創作人」，設計寫「設計人」。"]}, {"slide": 2, "secs": 105, "script": "【開場互動｜約 20 秒，網頁版新增】先問大家：工具機的加工誤差，大約有幾成來自熱變位？請舉手選 A 到 D。答案是 D，約四到七成。\n為什麼選這個題目？有三個原因。\n第一，熱變位是工具機最大的誤差來源。文獻統計，加工誤差大約有四到七成來自熱變位；鋼材每一公尺、每升高一度，就會伸長大約 0.01 毫米。龍門加工機的結構動輒好幾公尺，只要一兩度的溫差，就會有幾十微米的變形。\n第二，龍門加工機很高，廠房越高的地方越熱。橫樑熱、立柱下段冷，整座龍門就會往一邊傾斜，就像左邊這張圖，加工精度很難守在 0.02 毫米以內。\n第三，這個題目延續我們在 CSME2025 研討會發表的研究。我們已經用 COMSOL 比較了 30 組冷卻點位，找出最有效的位置；這次再加上控制方法，整理成一件發明專利。依照規則單的分類，屬於 E 類「現有機械的改善方式」。\n下一頁，我們先看市面上現在怎麼解決熱變位。", "qa": [], "memo": []}, {"slide": 3, "secs": 95, "script": "目前業界處理熱變位，大致有四種做法。\n做法一是恆溫廠房，整間廠房控溫。效果好，但建置和電費都很高，大型龍門的廠房很難做到。\n做法二是 CNC 熱補償軟體，例如 Okuma 的 TAS-C，用溫度感測器加上軸的位置資料預測變形，再讓刀具反向補償。問題是結構本身還是在變形，而傾斜這種變形很難靠補償修正；三菱重工推出龍門機時也提到，立柱的傾斜和收縮是補正功能修正不了的。\n做法三是冷卻機，冷卻的是主軸或切削液，處理的是加工產生的熱，不是環境造成的上下溫差。\n做法四是在鑄件裡面做流道、循環溫控液體。效果不錯，但要改鑄件，舊機台沒辦法加裝。\n所以這四種做法有一個共同缺口：沒有一種是依照龍門上下的溫差，分別調整橫樑和立柱的冷卻。這就是我們的切入點：外貼水冷板，加上上下溫差控制，直接讓結構均溫，而且可以和熱補償軟體一起使用。", "qa": ["市售龍門機有沒有處理立柱變形的？→ 有。三菱（現 Nidec）MVR 系列從 2014 年的 MVR-Eχ 起標配「熱穩定立柱」，在立柱內封入溫度控制介質，再加上橫樑隔熱，官方數據是 X、Z 軸直角度變化每 500 mm 在 6 μm 以內。差異：它是出廠就做在立柱裡，官方資料沒提到依溫差控制，也不能加裝到舊機台；本案是主動依溫差調整、外貼可加裝。", "Mazak、FANUC 呢？→ Mazak 依主軸轉速和機台溫度抑制刀尖位置變化，FANUC 用多支溫度感測器以 AI 建立熱變位模型。兩者本質上都屬於做法二：補償刀尖位置，不是讓結構不變形，可以和本案並用。"], "memo": []}, {"slide": 4, "secs": 105, "script": "接下來是先前技術，也就是專利說明書一定要寫的「習知技術」。我們找了五件最相關的前案。\n最接近的是 EP 4011545。它在橫樑裡設冷卻迴路，量單一點的溫度，高於上限就開閥、低於下限就關閥；但它只看單點溫度，也不分上下區域調整。\n第二件 US 6,923,603 要特別注意：它的實施例已經用立柱上下的溫差來開關泵浦，所以「用上下溫差控制」這件事本身不是新的。但它只有立柱裡一條迴路、一台泵浦整體開關，上下沒辦法分別調整，也沒有停止門檻。\n另外，US 5,582,237 用可貼附的熱交換袋，需要加熱器和管路；US 6,675,549 是送同溫空氣，讓立柱前後同溫，處理的是前後溫差；中興大學的碩士論文是在橫樑裝冷卻水塊，控溫位置只在橫樑。\n最後補充台灣前案：我們用 Google Patents 查了國別 TW，去重後 9 件逐件看過；最接近的是東芝 TWI566878B，以及兩件用溫差控制冷卻機的專利，但都不是依結構上下溫差分區調整，結論和國外前案一致。\n下一頁，我們把這五件前案和本案放在一起逐項比較。", "qa": [], "memo": ["中興碩論目前只讀到摘要，控制方式待讀全文確認。", "台灣前案已用 Google Patents（國別 TW，2026-11-26）查過 9 件：TWI566878B 東芝（柱與樑內部水槽）、TWI618597B（依加工液與機體溫差啟停冷卻機）、TWI777382B 工研院（主軸送風，避免壓縮機反覆開關）、TW201700213A 中興（主軸支撐外貼溫控片）、TWI334809B（工件夾具恆溫）、TWI718287B Disco（定溫水）、TWI814955B 星精密（控制盤散熱）、TW320588B 日立精機（熱變位補償）、TW498011B 宮野（籠式機架通溫控液）。智慧局 GPSS 尚未檢索，正式申請前建議再查一次。"]}, {"slide": 5, "secs": 90, "script": "這頁回答最重要的問題：本案跟既有專利差在哪？我們挑了五個特徵逐一比較。\n第一，量的是不是上下溫差：除了本案，只有 US 6,923,603 也是，但它只量立柱的上下兩點；本案量的是橫樑上部對立柱下段。\n第二，有沒有同時顧到橫樑和立柱：表上這五件前案都只顧其中一個；另外查到東芝的 US 9,511,465 兩者都冷卻，但它不量溫度、也不分區。\n第三，上部和下部能不能分別調整：US 6,923,603 是一條迴路整體開關；US 5,582,237 雖然可以分處冷卻或加熱，但依據的是流體溫度，不是結構的溫差。\n第四，有沒有啟動、停止兩個門檻：EP 4011545 有上下限，但用的是單點溫度；US 6,923,603 是依溫差分段運轉，沒有停止門檻。\n第五，能不能外貼、加裝到舊機台：前案只有 US 5,582,237 做得到。\n結論是：這五件前案沒有一件同時具備這五項，本案的新穎性就在這個組合。", "qa": ["有沒有前案也同時顧橫樑和立柱？→ 有：東芝機械 US 9,511,465（台灣同族 TWI566878B），雙柱龍門的立柱和橫樑內部做成互通的水槽，裝固定溫度的冷卻水。差異：它只有水位感測器，沒有量溫度，不依溫差控制、也不分區調整；水槽做在鑄件內部，舊機台不能加裝；而且它是做光學模具的小型超精密機，不是一般大型龍門機。所以本案「溫差量測＋分區調整＋雙門檻＋外貼」的組合仍然成立。", "中興碩論只讀到摘要，未揭露的項目標「－」。"], "memo": ["網頁版：點矩陣任一格會跳出原文出處和摘要，被追問時可以直接點給老師看。"]}, {"slide": 6, "secs": 75, "script": "接下來說明我們從哪裡突破。規則單列了六類改善方法，本案用到其中五類。\n材料：水冷板用鋁合金或銅，和結構之間加導熱膏或導熱墊，降低接觸熱阻。\n機械結構：在橫樑正面、上表面和兩支立柱正面外貼水冷板，不需要改造鑄件。\n設計與電子電機運作方式：控制單元讀兩支溫度感測器，依照溫差和兩個門檻，用比例閥分別調整上下的流量。\n技術整合與調整：把 COMSOL 模擬選位、溫度感測、水冷和控制整合成一套，先用模擬選點，再上實機。\n參數改變：包括水溫、門檻、壓力和控制週期，後面會詳細說明。\n唯一不涉及的是製程改善，因為我們改的是機台本身，不是加工製程。接下來兩頁看這套系統怎麼組成、怎麼運作。", "qa": [], "memo": []}, {"slide": 7, "secs": 70, "script": "這頁是系統構成，對應專利申請書的「圖式」和「符號說明」。專利圖會用數字標示每個元件，這些數字要和請求項、說明書一致。\n11 是立柱，12 是橫樑。21 是第一溫度感測器，裝在橫樑上部；22 是第二溫度感測器，裝在立柱下段。31 是上部溫控模組，裝在橫樑的 9、11 號點位；32 是下部溫控模組，裝在兩支立柱的 1、5 號點位。\n運作方式是：兩支感測器把上、下溫度送到控制單元 40；控制單元算出溫差後，透過冷卻水供應單元 50 的比例閥，分別調整流到上部和下部模組的水量。藍色實線是水路 33，虛線是訊號線。本案的溫控模組以水冷板作為實施例。", "qa": [], "memo": []}, {"slide": 8, "secs": 65, "script": "這是控制流程，也就是方法項請求項 7 的步驟。\nS1，量測橫樑上部和立柱下段的溫度；S2，計算溫差 ΔT。S3，判斷溫差有沒有達到啟動門檻：沒有的話，就直接回到 S1 繼續量測。\n如果達到了，就到 S4，加大上部冷卻，同時依溫差比例調整下部模組。接著 S5，重新量測，看溫差有沒有降到停止門檻以下：還沒有，就回到 S4 繼續調整；降到了，就到 S6 恢復基本供水，再回到 S1 持續監測。\n這裡用兩個不同的門檻，例如啟動 0.3 度、停止 0.1 度，是為了避免溫差在門檻附近時，閥門一直開開關關，這叫做「遲滯控制」。", "qa": [], "memo": []}, {"slide": 9, "secs": 80, "script": "整理一下，本發明有三個創新點。\n第一，溫差加雙門檻控制。我們量的是橫樑上部和立柱下段的溫差，並且設啟動、停止兩個門檻，避免閥門頻繁切換。對照前案，US 6,923,603 只量立柱上下，也沒有停止門檻。\n第二，上下分區調整，這是本案最核心的一點。上部和下部的水冷板分開調整流量，讓上下溫度趨於一致，而不是整台一起降溫；表上的前案沒有一件是依上下溫差，分別調整上部和下部。\n第三，依模擬結果用最少的佈點。根據 COMSOL 比較 30 組點位的結果配置模組，只需要兩組模組、兩支感測器，不必在實機上一片一片貼片測試。\n最後，因為本案改善的是方法和系統，所以申請發明專利；新型專利只保護形狀和構造，不能保護方法。", "qa": ["US 5,582,237 也讓溫度均勻，差在哪？→ 它用加熱後的流體讓溫度分布均勻，依據的是流體溫度，沒有用結構的上下溫差來控制，也沒有分上下區調整。"], "memo": []}, {"slide": 10, "secs": 65, "script": "這頁是本案的數據基礎，來自我們的 CSME2025 論文。\n模擬條件是：地面 22 度，每升高 100 公分加 1 度，用 22 度的貼板代替水路；把龍門分成 12 個點位，比較 30 種組合。因為 Y、Z 方向的變動很小，所以用 X 方向位移最接近 0 當作判斷標準。\n結果是第 8 組，也就是橫樑正面和頂面，以及第 23 組，兩支立柱正面，效果最好。所以本案把第 8 組當作上部模組的位置，第 23 組當作下部模組的位置。\n但從右邊的溫度圖可以看到，貼板之後上下還是差了大約 0.4 到 0.6 度。只靠固定貼板不夠，這就是本案再加上溫差控制的原因。", "qa": [], "memo": ["X 位移取自研討會簡報；論文表一、表二的第 1、6、8、23 組數值和簡報差 10 倍以上，報告前請用原始 COMSOL 資料確認。", "若被問為什麼不選 X 位移絕對值更小的第 13、20、28 組，要能說明選組時除了 X 位移還考慮了什麼（例如上下溫差），請依你們實際的選組理由準備。"]}, {"slide": 11, "secs": 85, "script": "接下來是權利範圍的核心：獨立項，請求項 1。獨立項決定保護範圍有多大，所以要寫得越上位、涵蓋越廣越好。\n寫法分三段。前言說明這是什麼：「一種龍門加工機之溫差式均溫系統」。接著逐項列出元件：兩支溫度感測器、上部和下部溫控模組，以及控制單元。最後「其中」之後寫特徵，也就是和先前技術不同的地方：溫差達到啟動門檻時，控制單元加大上部冷卻、調整下部模組，直到溫差降到停止門檻，而且停止門檻小於啟動門檻。\n這裡有兩個用字是刻意的。第一，我們寫「溫控模組」而不寫「水冷板」，這樣別人改用其他控溫方式，也會落入保護範圍。第二，「分別控制」上下模組，以及「停止門檻小於啟動門檻」這兩句，是為了和 US 6,923,603 一條迴路、整體開關的做法劃清界線。", "qa": [], "memo": []}, {"slide": 12, "secs": 55, "script": "附屬項是在獨立項之外再加限定條件。範圍比較窄，但比較不容易被前案推翻；如果審查時獨立項被認為沒有新穎性，附屬項還能撐住，就像多層防線。\n請求項 2 限定模組的位置，也就是模擬找出的 9、11 和 1、5 號點位；第 3 項限定兩個門檻的範圍；第 4、5、6 項把水冷板的水溫、流量、壓力和材質寫清楚。\n右邊的請求項 7 是方法項，保護的是「怎麼做」：量測、算溫差、達到啟動門檻就調整、降到停止門檻就維持基本冷卻，然後重複，對應前面的流程圖。", "qa": [], "memo": []}, {"slide": 13, "secs": 75, "script": "這頁把白板上老師列的參數，逐一對應到本案。\n溫度有三個：啟動門檻 0.2 到 0.4 度、停止門檻 0.05 到 0.15 度、冷卻水溫 21 到 23 度。壓力是 0.1 到 0.3 MPa，流量每分鐘 1 到 5 公升。比例是上部對下部的流量比。時間是 5 到 30 秒的控制週期。材料是結構用的 AISI 4340，以及鋁合金或銅的水冷板。製程對應請求項 7 的方法步驟；模型是雙門檻遲滯，加上依溫差比例調整流量的控制模型。\n要老實說明的是：有論文依據的是冷卻水溫、結構材料，以及啟動門檻的上限。貼板後上下還差 0.4 到 0.6 度，門檻要比它低，控制才會啟動。其他是我們的設計值，之後要用 COMSOL 模擬驗證。", "qa": ["範圍怎麼來的？→ 專利的數值範圍要有實施例支持；冷卻水溫和材料來自論文，其餘是設計值，下一步用 COMSOL 跑出數值。", "「Model」如果老師指的是模擬模型，就是論文的 COMSOL 模型。"], "memo": []}, {"slide": 14, "secs": 70, "script": "最後整理預期功效。左邊是本案本身的好處：第一，縮小上下溫差，減少龍門傾斜造成的加工誤差；第二，溫差超過門檻才加大冷卻，減少冷卻機不必要的運轉；第三，依模擬的最佳點位，只需要兩組模組、兩支感測器；第四，水冷板貼在結構表面，不必改造鑄件。\n右邊對照前面四種市面做法：跟恆溫廠房比，不必整間控溫；跟熱補償軟體比，我們直接減少傾斜，也能和補償一起用；跟冷卻機比，我們補上它沒處理的環境上下溫差；跟結構內流道比，外貼就好，舊機台也能加裝。\n也要誠實說明限制：目前只有固定貼板的模擬，溫差控制的效果和改善率，還需要模擬驗證。", "qa": [], "memo": ["還缺三樣數據：不加貼板的基準位移（才能算改善率）、加入溫差控制後的模擬、門檻與流量等參數的驗證。"]}, {"slide": 15, "secs": 45, "script": "總結一下，本案要讓龍門不再上熱下冷。我們用橫樑和立柱的上下溫差作為依據，分區調整溫控模組，再用兩個門檻避免頻繁切換。\n回到白板的三個要求：創新性是依上下溫差分區調整；解決的痛點是龍門上熱下冷造成傾斜；權利範圍是以「溫控模組」為上位用語的獨立項，加上水冷板的附屬項和各類參數。\n以上是我們的報告，謝謝聆聽，歡迎老師和同學提問。", "qa": ["US 6,923,603 也用上下溫差，差在哪？→ 它只量立柱上下兩點，立柱裡一條迴路、一台泵浦整體開關，也沒有停止門檻；本案量橫樑上部對立柱下段，橫樑和立柱上的溫控模組分別調整，並用啟動、停止兩個門檻避免頻繁切換。", "參數範圍怎麼來？→ 冷卻水溫與結構材料來自論文，其餘是設計值，將以 COMSOL 驗證。", "為什麼申請發明不申請新型？→ 新型只保護形狀、構造，不能保護方法，也不做實質審查；本案要保護控制方法和參數範圍，所以申請發明。", "要不要申請國外或 PCT？→ 台灣不是 PCT 會員，智慧局不受理 PCT 申請；可以先在台灣申請，再在 12 個月內主張優先權向其他國家申請（台灣是 WTO 會員，優先權會被承認）。PCT 只有申請案、沒有「PCT 專利」，最後還是要進入各國的國家階段審查。"], "memo": []}];

  if (k === 'Escape') { closeEvi(); return; }
  if (fromPV && !PV_KEYS.includes(k)) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); goSlide(curI + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); goSlide(curI - 1); }
  else if (k === 'Home') goSlide(0); else if (k === 'End') goSlide(SLIDES.length - 1);
  else if (k === 'z' || k === 'Z' || k === '0') goSlide(0);
  else if (/^[1-7]$/.test(k)) { const t = SLIDES.findIndex(s => s.st === +k); if (t >= 0) goSlide(t); }
  else if (k === 'f' || k === 'F') fs();
  else if ((k === 'r' || k === 'R') && cur && cur.scene) { const st = cur.steps[cur.step]; if (st.cam) flyTo(camPos(cur, st), st.tgt, 1.2); }
  else if (k === 'q' || k === 'Q') openQA();
  else if (k === 'p' || k === 'P') openPresenter();
}
function fs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { }); else document.exitFullscreen().catch(() => { }); }
$('bPrev').onclick = prev; $('bNext').onclick = next; $('bFs').onclick = fs;
$('bPv').onclick = () => openPresenter(); $('bQa').onclick = () => (qaOpen() ? closeQA() : openQA());

/* ================= 簡報工具：原文依據、備答卡、講者視窗 ================= */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/* 提示訊息 */
const toastEl = document.createElement('div'); toastEl.id = 'toast'; stage.appendChild(toastEl);
let toastT = 0;
function toast(m, ms = 4800) { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms); }

/* 差異矩陣（第 5 頁）：點格子看原文依據 */
let eviEl = null, eviTd = null;
function closeEvi() { if (eviEl) { eviEl.remove(); eviEl = null; } if (eviTd) { eviTd.classList.remove('sel'); eviTd = null; } }
function openEvi(td) {
  closeEvi();
  const [j, i] = td.dataset.ev.split(',').map(Number), e = EVI[j] && EVI[j][i], s = EV_SRC[j], m = MX[i] && MX[i][j + 1];
  if (!e || !s || !m) return;
  eviTd = td; td.classList.add('sel');
  const el = document.createElement('div'); el.className = 'evi ui';
  el.innerHTML = `<button class="ex" title="關閉（Esc）">✕</button><div class="eh"><b>${s.n}</b><span>${MX[i][0]}</span></div>`
    + `<div class="eb"><span class="sy ${m[0]}">${SYM[m[0]]}<small>${m[1]}</small></span><div><i class="loc">${e[0]}</i><p>${e[1]}</p>${e[2] ? `<q>原文：“${e[2]}”</q>` : ''}</div></div>`
    + `<div class="ef"><span>${s.who}</span>${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">看原文 ↗</a>` : ''}</div>`;
  el.querySelector('.ex').onclick = closeEvi;
  el.style.visibility = 'hidden'; stage.appendChild(el); eviEl = el;
  const sr = stage.getBoundingClientRect(), k = sr.width / W, cr = td.getBoundingClientRect();
  const x = (cr.left - sr.left) / k, y = (cr.top - sr.top) / k, w = cr.width / k, h = cr.height / k, pw = el.offsetWidth, ph = el.offsetHeight;
  let top = y + h + 10; if (top + ph > 830) top = Math.max(14, y - ph - 10);
  el.style.left = clamp(x + w / 2 - pw / 2, 16, W - pw - 16) + 'px'; el.style.top = top + 'px'; el.style.visibility = '';
}

/* 備答卡（Q） */
const TAGS = [['t0', '有依據'], ['t1', '推論'], ['t2', '待驗證'], ['t3', '待補'], ['t2', '部分待補'], ['t2', '部分待驗證']];
const tagH = t => `<em class="tg ${TAGS[t][0]}">${TAGS[t][1]}</em>`;
const qaEl = document.createElement('div'); qaEl.id = 'qa'; qaEl.className = 'ui';
let QS = 0;
{
  let g0 = '', list = '';
  QA.forEach((q, i) => { if (q.g !== g0) { g0 = q.g; list += `<h5>${q.g}</h5>`; } list += `<button data-i="${i}"><i>${i + 1}</i><span>${q.q}</span>${tagH(q.tag)}</button>`; });
  qaEl.innerHTML = `<div class="qw"><div class="qh"><b>備答卡</b><span>可能被問的 ${QA.length} 題・每題約 30 秒｜橘色號碼＝和目前這頁有關｜↑↓ 換題・Q 或 Esc 關閉</span><button id="qaX">關閉 ✕</button></div>`
    + `<div class="qb"><div class="ql">${list}</div><div class="qd" id="qaD"></div></div></div>`;
  stage.appendChild(qaEl);
  qaEl.querySelector('#qaX').onclick = closeQA;
  qaEl.querySelectorAll('.ql button').forEach(b => b.onclick = () => qaSel(+b.dataset.i));
  qaEl.addEventListener('click', e => {
    if (e.target === qaEl) { closeQA(); return; }
    const g = e.target.closest('[data-go]'); if (g) { closeQA(); goSlide(+g.dataset.go - 1); }
  });
}
function qaSel(i) {
  QS = (i + QA.length) % QA.length; const q = QA[QS];
  qaEl.querySelectorAll('.ql button').forEach(b => b.classList.toggle('sel', +b.dataset.i === QS));
  const L = qaEl.querySelector('.ql'), sb = L.querySelector('button.sel');
  if (sb) { if (sb.offsetTop < L.scrollTop) L.scrollTop = sb.offsetTop - 30; else if (sb.offsetTop + sb.offsetHeight > L.scrollTop + L.clientHeight) L.scrollTop = sb.offsetTop + sb.offsetHeight - L.clientHeight + 10; }
  $('qaD').innerHTML = `<div class="qn">Q${QS + 1}｜${q.g}</div><h3>${q.q}</h3><p>${q.a}</p>`
    + `<div class="qs">${tagH(q.tag)}<span>依據：${q.src}</span></div>`
    + `<div class="qs"><span>相關頁：</span>${q.pg.map(p => `<button data-go="${p}">第 ${p} 頁</button>`).join('')}</div>`;
}
function openQA() {
  closeEvi(); const n = curI + 1;
  qaEl.querySelectorAll('.ql button').forEach(b => b.classList.toggle('rel', QA[+b.dataset.i].pg.includes(n)));
  const f = QA.findIndex(q => q.pg.includes(n));
  qaEl.classList.add('open'); qaSel(f >= 0 ? f : QS);
}
function closeQA() { qaEl.classList.remove('open'); }
function qaOpen() { return qaEl.classList.contains('open'); }

/* 講者視窗（P）：講稿、計時、下一步預告、本頁備答；主視窗翻頁時同步 */
const PS = []; { let a = 0; SLIDES.forEach((_, i) => { PS[i] = a; a += NOTES[i] ? NOTES[i].secs : 0; }); }
const TOTAL = NOTES.reduce((a, n) => a + n.secs, 0);
const TM = { run: false, t0: 0, acc: 0, slideAt: 0, slideI: -1 };
const elapsed = () => TM.acc + (TM.run ? performance.now() - TM.t0 : 0);
function tmToggle() { if (TM.run) { TM.acc += performance.now() - TM.t0; TM.run = false; } else { TM.run = true; TM.t0 = performance.now(); } updTimer(); }
function tmReset() { TM.acc = 0; TM.t0 = performance.now(); TM.slideAt = 0; updTimer(); }
const speakerOf = i => SPEAK.find(s => s.pages.includes(i + 1));
const pagesStr = ps => { const r = []; ps.forEach(p => { const l = r[r.length - 1]; if (l && p === l[1] + 1) l[1] = p; else r.push([p, p]); }); return 'p' + r.map(([a, b]) => a === b ? a : a + '–' + b).join('、'); };
const PV_CSS = `*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;background:#0e151c;color:#e9eef2;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;background:#16222e;border-bottom:1px solid #263544}
.pg{flex:1;display:flex;align-items:baseline;gap:14px;min-width:0}
.pg b{font-family:"Roboto Mono",Consolas,monospace;font-size:28px;color:#f6a26b;white-space:nowrap}
#vTtl{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vStep{font-size:14px;color:#9fb0ba;white-space:nowrap}
.tm{display:flex;align-items:center;gap:10px}
#vClock{font-family:"Roboto Mono",Consolas,monospace;font-size:34px;font-weight:700}
#vPace{font-size:14px;padding:4px 12px;border-radius:20px;background:#263544;color:#c9d2da;white-space:nowrap}
#vPace.ok{background:#1f4a2e;color:#c7ecd2}#vPace.late{background:#5a2414;color:#ffd2c2}#vPace.early{background:#1d3b5a;color:#cfe3f6}
button{font:inherit;font-size:15px;border:1px solid #3a4c5e;background:#1c2b39;color:#e9eef2;border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:#e8722c}
.spk{display:flex;align-items:center;gap:10px;padding:8px 20px;font-size:15px;color:#9fb0ba;border-bottom:1px solid #1f2d3a;min-height:42px}
.spk i{width:12px;height:12px;border-radius:50%}.spk b{font-size:20px;color:#fff;margin-right:6px}
main{flex:1;display:grid;grid-template-columns:1.4fr 1fr;min-height:0}
section{padding:12px 20px 16px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
section.r{border-left:1px solid #1f2d3a;background:#111b24}
h6{font-size:13px;letter-spacing:.12em;color:#f6a26b;font-weight:700;margin-top:6px}
h6 small{color:#7d8f9c;font-weight:400;letter-spacing:0;margin-left:10px}
.say{font-size:25px;line-height:1.5;font-weight:700;color:#fff;border-left:4px solid #e8722c;padding-left:14px}
.scr p{font-size:18.5px;line-height:1.75;color:#d5dde3;margin-bottom:10px}
.nx{font-size:17px;line-height:1.6;color:#d5dde3;background:#16222e;border-radius:8px;padding:10px 14px}
.nx b{color:#fff}.nx .sw{display:block;margin-top:6px;color:#ffb08a;font-weight:700}
ul{list-style:none;display:flex;flex-direction:column;gap:8px}
li{font-size:15.5px;line-height:1.6;color:#d5dde3;background:#16222e;border-radius:8px;padding:8px 12px}
li.q{border-left:3px solid #2f7dc0}li.q b{color:#9cc6ee}li.empty{background:none;color:#6c7d8a;padding:0}
footer{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#16222e;border-top:1px solid #263544}
footer button{font-size:17px;padding:8px 18px}.hint{font-size:13px;color:#7d8f9c}
#vSplit{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:#9fb0ba;justify-content:flex-end}
#vSplit span{display:flex;align-items:center;gap:6px}#vSplit i{width:10px;height:10px;border-radius:50%}#vSplit span.cur{color:#fff;font-weight:700}`;
const PV_BODY = `<header><div class="pg"><b id="vPg"></b><span id="vTtl"></span><span id="vStep"></span></div>
<div class="tm"><b id="vClock">00:00</b><span id="vPace"></span><button id="tStart">開始</button><button id="tReset">歸零</button></div></header>
<div class="spk" id="vSpk"></div>
<main><section class="l"><h6>現在這一步</h6><div class="say" id="vSay"></div><h6>本頁講稿<small id="vSecs"></small></h6><div class="scr" id="vScript"></div></section>
<section class="r"><h6>接下來</h6><div class="nx" id="vNext"></div><h6>本頁備答</h6><ul id="vQa"></ul><h6>備註</h6><ul id="vMemo"></ul></section></main>
<footer><button id="pPrev">‹ 上一步</button><button id="pNext">下一步 ›</button><span class="hint">鍵盤 ← → 也能翻頁</span><div id="vSplit"></div></footer>`;
let PW = null;
function openPresenter() {
  if (PW && !PW.closed) { PW.focus(); syncPresenter(true); return; }
  let w = null; try { w = window.open('', 'gantry-presenter', 'width=1180,height=760'); } catch (e) { }
  if (!w) { toast('瀏覽器擋下了講者視窗：請允許這個網站開啟彈出式視窗，再按 P 或「講者」。'); return; }
  try {
    w.document.open();
    w.document.write(`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>講者視窗｜${DECK.title}</title><style>${PV_CSS}</style></head><body>${PV_BODY}</body></html>`);
    w.document.close();
    const d = w.document;
    d.getElementById('pPrev').onclick = () => prev();
    d.getElementById('pNext').onclick = () => next();
    d.getElementById('tStart').onclick = tmToggle;
    d.getElementById('tReset').onclick = tmReset;
    d.addEventListener('keydown', e => onKey(e, true));
  } catch (e) { try { w.close(); } catch (e2) { } toast('這個瀏覽環境不允許講者視窗，請改用網站版或離線版。'); return; }
  PW = w; TM.slideI = -1; syncPresenter(true);
}
function syncPresenter(force) {
  if (!PW || PW.closed || !cur) return;
  let d; try { d = PW.document; } catch (e) { return; }
  const g = id => d.getElementById(id); if (!g('vPg')) return;
  const n = curI, N = NOTES[n] || { secs: 0, script: '', qa: [], memo: [] }, st = cur.steps[cur.step] || {}, sp = speakerOf(n);
  if (TM.slideI !== n) { if (TM.slideI >= 0 && !TM.run && elapsed() === 0) tmToggle(); TM.slideI = n; TM.slideAt = elapsed(); force = true; }
  g('vPg').textContent = `${n + 1} / ${SLIDES.length}`;
  g('vTtl').textContent = cur.title || (n ? '結語' : '封面');
  g('vStep').textContent = `${cur.kick ? cur.kick + '｜' : ''}第 ${cur.step + 1} / ${cur.steps.length} 步`;
  g('vSay').textContent = st.say || '（這一步沒有字幕，照講稿說）';
  if (force) {
    g('vSpk').innerHTML = sp ? `<i style="background:${sp.color}"></i>講者 <b>${sp.name}</b><span>負責 ${pagesStr(sp.pages)}</span>` : '';
    g('vScript').innerHTML = N.script.split('\n').map(t => `<p>${esc(t)}</p>`).join('');
    g('vScript').parentNode.scrollTop = 0;
    g('vSecs').textContent = `預計 ${mmss(N.secs * 1000)}（全場第 ${mmss(PS[n] * 1000)}～${mmss((PS[n] + N.secs) * 1000)}）`;
    const rel = QA.map((q, i) => [q, i]).filter(([q]) => q.pg.includes(n + 1));
    g('vQa').innerHTML = N.qa.map(t => `<li>${esc(t)}</li>`).join('') + rel.map(([q, i]) => `<li class="q"><b>備答卡 Q${i + 1}</b>　${esc(q.q)}</li>`).join('') || '<li class="empty">（無）</li>';
    g('vMemo').innerHTML = N.memo.map(t => `<li>${esc(t)}</li>`).join('') || '<li class="empty">（無）</li>';
    g('vSplit').innerHTML = SPEAK.map(s => `<span class="${s === sp ? 'cur' : ''}"><i style="background:${s.color}"></i>${s.name} ${pagesStr(s.pages)}</span>`).join('') + '<span>（建議分工，可改）</span>';
  }
  let nx;
  if (cur.step < cur.steps.length - 1) nx = `<b>下一步：</b>${esc(cur.steps[cur.step + 1].say || '（無字幕）')}`;
  else if (n < SLIDES.length - 1) {
    const S2 = SLIDES[n + 1], sp2 = speakerOf(n + 1), s0 = S2.steps && S2.steps[0] && S2.steps[0].say;
    nx = `<b>下一頁：第 ${n + 2} 頁｜${esc(S2.title || '結語')}</b>${s0 ? '<br>' + esc(s0) : ''}${sp2 && sp2 !== sp ? `<span class="sw">換人：${sp2.name} 上台</span>` : ''}`;
  } else nx = '<b>最後一頁</b>：謝謝聆聽，開放提問（主畫面按 Q 開備答卡）';
  g('vNext').innerHTML = nx;
  updTimer();
}
function updTimer() {
  if (!PW || PW.closed) return; let d; try { d = PW.document; } catch (e) { return; }
  const c = d.getElementById('vClock'), p = d.getElementById('vPace'); if (!c || !p) return;
  const e = elapsed(), n = Math.max(0, curI), N = NOTES[n] || { secs: 0 }, a = PS[n] * 1000, b = a + N.secs * 1000;
  c.textContent = mmss(e);
  if (!TM.run && e === 0) { p.className = ''; p.textContent = `尚未計時｜全場預計 ${mmss(TOTAL * 1000)}（翻頁就自動開始）`; }
  else {
    let t = `本頁 ${mmss(e - TM.slideAt)} / ${mmss(N.secs * 1000)}`, cls = 'ok';
    if (e > b + 5000) { cls = 'late'; t += `｜落後 ${mmss(e - b)}`; } else if (e < a - 5000) { cls = 'early'; t += `｜超前 ${mmss(a - e)}`; } else t += '｜進度剛好';
    p.className = cls; p.textContent = t;
  }
  d.getElementById('tStart').textContent = TM.run ? '暫停' : e ? '繼續' : '開始';
}
setInterval(updTimer, 500);

/* 主迴圈 */
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; frame(dt); requestAnimationFrame(loop); }
function frame(dt) {
  const S = cur; if (!S) return;
  for (const k in S.target) {
    const v = S.target[k];
    if (typeof v === 'number' && typeof S.params[k] === 'number') { S.params[k] += (v - S.params[k]) * Math.min(1, dt * 2.6); if (Math.abs(v - S.params[k]) < 1e-4) S.params[k] = v; }
  }
  if (S.scene) {
    S.sc.update(S, dt);
    for (const n in S.parts) {
      const p = S.parts[n]; p.vis += (p.visT - p.vis) * Math.min(1, dt * 4); p.hot += (p.hotT - p.hot) * Math.min(1, dt * 5);
      p.root.position.copy(p.base);
      p.root.visible = (p.alpha ?? 1) > .02 && p.vis > .07;
      const v = .05 + .95 * p.vis * (p.alpha ?? 1), pulse = p.hot * (.75 + .25 * Math.sin(performance.now() / 260));
      for (const r of p.mats) {
        if (r.fill) {
          r.fill.opacity = r.op * v;
          if (!r.keepColor) { r.fill.color.copy(r.base); r.fill.emissive.copy(r.base).multiplyScalar(pulse * (r.glow ?? .45)); }
          r.fill.depthWrite = !r.noDepth && p.vis > .5 && (p.alpha ?? 1) > .5;
        }
        if (r.line) { r.line.opacity = r.lop * v; r.line.color.copy(r.lbase).lerp(HOTE, p.hot); }
      }
    }
    stepTween(dt); if (!tw.active) controls.update();
    if (sizeView()) { renderer.render(S.scene3, camera); updateLabels(S); }
    if (S.sc.panel && !pick(S, S.step, 'p', S.param)[0]) {
      const pc = $('pc'), h = S.sc.panel(S); if (pc.dataset.dyn !== h) { pc.dataset.dyn = h; pc.innerHTML = h; }
    }
  }
  if (S.roEl) for (const [el, f] of S.roEl) el.textContent = f(S);
  if (S.ui) for (const u of S.ui) u();
}

fit();
if (SHOT) stage.classList.add('notr');
let start = 0, startStep;
try { const m = location.hash.slice(1).split('-'); const h = parseInt(m[0], 10); if (h >= 1 && h <= SLIDES.length) start = h - 1; if (m[1]) startStep = parseInt(m[1], 10) - 1; } catch (e) { }
goSlide(start, false, startStep);
requestAnimationFrame(loop);
window.__deck = {
  goSlide, next, prev, get cur() { return cur; }, get i() { return curI; },
  openQA, closeQA, openPresenter, get pw() { return PW; }, closeEvi,
  evi(j, i) { const td = document.querySelector(`[data-ev="${j},${i}"]`); if (td) openEvi(td); return !!eviEl; },
  go(n, st) { return new Promise(r => { goSlide(n, false, st); setTimeout(() => { for (let i = 0; i < 90; i++) frame(1 / 30); LB.forEach(l => l.born = 0); frame(1 / 30); r('ok'); }, 300); }); }
};
</script>
