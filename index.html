<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE  期末專利報告，口頭簡報輔助：清楚、可信、一步一個重點
   IDEA   一座會「上熱下冷」的龍門，跟著講稿一步步加上感測器、水冷板與控制
   PICTURE 右側 3D 龍門（溫度色、變形放大、水路流動），第 8 頁是雙門檻控制模擬
   COLOUR 沿用原 pptx：暖白底 #f4f3ef、深藍 #16222e、橘 #e8722c；冷用藍 #2f7dc0
   TYPE / LAYOUT  Noto Sans TC + Roboto Mono；版面與 AEM 互動簡報相同（1600×900 舞台） */
:root{
  --bg:#f4f3ef; --ink:#16222e; --muted:#5d6873; --line:#d8d3c8; --blue:#1d4f7c; --blue2:#9dbad6; --cold:#2f7dc0;
  --accent:#e8722c; --acc2:#fde9da; --deep:#a8440f; --navy:#16222e; --green:#2f7d4a; --red:#b8321a; --panel:rgba(255,255,255,.9);
  --mono:"Roboto Mono",Consolas,monospace;
  --ez:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e151c;overflow:hidden;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;background:radial-gradient(ellipse at 70% 40%,#fbfaf6 0%,var(--bg) 72%);overflow:hidden;transform-origin:center center;user-select:none}

/* ---------- 版面方框 ---------- */
.box{position:absolute;background:var(--panel);border:1.5px solid #d6d0c4;border-radius:12px;overflow:hidden;
  transition:left .8s var(--ez),top .8s var(--ez),width .8s var(--ez),height .8s var(--ez),opacity .45s,border-color .45s,background .45s;
  box-shadow:0 6px 22px rgba(22,34,46,.06)}
#hdr{left:40px;top:24px;width:860px;height:112px;padding:16px 28px 0 30px;border-left:6px solid var(--accent)}
#kick{font-size:15px;letter-spacing:.12em;color:var(--deep);font-weight:500;white-space:nowrap;font-family:var(--mono)}
#ttl{margin-top:6px;font-size:36px;font-weight:900;line-height:1.2;white-space:nowrap}
#pgb{position:absolute;right:18px;top:14px;font-family:var(--mono);font-size:13px;color:#7d8790;border:1px solid #d6d0c4;border-radius:4px;padding:2px 8px;background:#fff}
#content{left:40px;top:152px;width:860px;height:600px;padding:26px 34px}
#model{left:920px;top:24px;width:640px;height:544px;background:radial-gradient(ellipse at 50% 42%,#ffffff 0%,#f3f1ec 82%)}
#mview{position:absolute;inset:0}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#lbl{position:absolute;inset:0;pointer-events:none}
#lbl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#mtag{position:absolute;left:16px;bottom:10px;font-size:15px;color:#7d8790;pointer-events:none;letter-spacing:.04em;z-index:3}
#mtag b{color:var(--accent);font-weight:700}
#param{left:920px;top:584px;width:640px;height:168px;padding:14px 20px}
#say{position:absolute;left:40px;right:40px;top:768px;height:56px;display:flex;align-items:center;gap:14px;z-index:6;pointer-events:none}
#say .no{font-family:var(--mono);font-size:14px;color:#fff;background:var(--accent);border-radius:20px;padding:5px 12px;white-space:nowrap}
#say .tx{flex:1;font-size:21px;line-height:1.4;color:#1d2a35;background:rgba(255,255,255,.94);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:9px 16px;box-shadow:0 4px 14px rgba(22,34,46,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
#dots{display:flex;gap:6px;flex-wrap:nowrap}
#dots b{width:10px;height:10px;border-radius:50%;background:#d3cdc1}
#dots b.on{background:var(--accent)} #dots b.done{background:#efb48c}

/* ---------- 版面模式 ---------- */
#stage.L-wide #hdr{width:540px}
#stage.L-wide #ttl{font-size:30px;margin-top:10px}
#stage.L-wide #content{width:540px}
#stage.L-wide #model{left:600px;width:960px}
#stage.L-wide #param{left:600px;width:960px}
#stage.L-flat #hdr{width:1520px}
#stage.L-flat #content{width:1520px}
#stage.L-flat #model{left:1640px;opacity:0}
#stage.L-flat #param{left:1640px;opacity:0}
#stage.L-cover #hdr{opacity:0;top:-140px}
#stage.L-cover #content{top:40px;height:712px;width:800px;background:transparent;border-color:transparent;box-shadow:none;padding:70px 30px 0 44px}
#stage.L-cover #model{left:760px;top:30px;width:820px;height:730px;background:transparent;border-color:transparent;box-shadow:none}
#stage.L-cover #param{top:930px;opacity:0}

/* ---------- 內容排版 ---------- */
.ci{height:100%;display:flex;flex-direction:column;gap:16px;font-size:25px;line-height:1.55;animation:fin .45s ease both}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[data-s]{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s,background .35s,border-color .35s,filter .35s}
[data-s].vis{opacity:1;transform:none}
.pt{border-left:4px solid var(--blue2);padding:4px 0 4px 16px;transition:border-color .35s,background .35s}
.pt b{display:block;font-size:26px;font-weight:700;color:var(--blue);line-height:1.35}
.pt span{display:block;font-size:21px;color:#3b4853;line-height:1.55}
.pt.on{border-left-color:var(--accent);background:linear-gradient(90deg,var(--acc2),rgba(253,233,218,0))}
.pt.on b{color:var(--deep)}
.lead{font-size:26px;font-weight:700;line-height:1.45}
.lead em{font-style:normal;color:var(--accent)}
.note{font-size:16.5px;color:var(--muted);line-height:1.55}
.warn{font-size:19px;color:#7a3a10;background:#fff4ea;border:1px solid #f0c7a3;border-radius:8px;padding:10px 14px;line-height:1.5}
.warn b{color:var(--deep)}
.mono{font-family:var(--mono)}
.row{display:flex;gap:22px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.grow{flex:1;min-height:0}
.fig{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.fig .im{flex:1;min-height:0;background:#fff;border:1px solid #ddd7cb;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.fig img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.fig .cap{font-size:16px;color:var(--muted);line-height:1.4}
.fig .cap b{color:var(--ink)}
.pm{font-style:normal;font-family:var(--mono);font-weight:700;font-size:1.02em;color:var(--deep);background:var(--acc2);border-radius:5px;padding:0 6px;margin:0 1px;white-space:nowrap}
.chip{display:inline-block;font-size:15px;border:1px solid #c9c2b5;border-radius:20px;padding:0 10px;margin-right:6px;background:#fff;color:#3b4853;vertical-align:middle;line-height:1.6;white-space:nowrap}
.chip.a{border-color:var(--accent);color:var(--deep);background:var(--acc2)}
.chip.n{border-color:var(--navy);color:#fff;background:var(--navy)}

/* 卡片 */
.cards{display:grid;gap:16px}
.card{background:#fcfbf8;border:1.5px solid #e1dbcf;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:border-color .35s,box-shadow .35s,background .35s,opacity .35s}
.card .n{font-family:var(--mono);font-size:14.5px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.card b{font-size:24px;color:var(--ink);line-height:1.3}
.card span{font-size:19px;color:#46535e;line-height:1.55}
.card.on{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,114,44,.15);background:#fffaf5}
.card.dk{background:var(--navy);border-color:var(--navy)}
.card.dk b{color:#fff}.card.dk span{color:#c9d2da}.card.dk .n{color:#f6a26b}
.card.dk.on{box-shadow:0 0 0 4px rgba(232,114,44,.3)}
.card .lim{margin-top:auto;border-top:1px solid #e6e0d4;padding-top:10px;font-size:17.5px;color:#3d6a96;line-height:1.5;transition:color .35s}
.card .lim.on{color:var(--deep);font-weight:700}
.card .ic{width:46px;height:46px;margin-bottom:4px}
.gapc{background:#fff3ea;border:1.5px solid #f1c4a4;border-radius:12px;padding:16px 22px;display:flex;flex-direction:column;gap:6px}
.gapc b{font-size:24px;color:var(--ink)}
.gapc span{font-size:20px;color:#4a3a30}

/* 表格 */
.tb{width:100%;border-collapse:collapse;font-size:20px;background:#fff;border-radius:10px;overflow:hidden}
.tb th,.tb td{padding:9px 14px;border-bottom:1px solid #e3ded4;text-align:left;transition:background .35s,color .35s,opacity .35s;line-height:1.45;vertical-align:middle}
.tb th{font-size:16px;color:#fff;font-weight:700;background:var(--navy);line-height:1.35}
.tb td.n,.tb .mono{font-family:var(--mono)}
.tb.tight td{padding:6px 14px}.tb.tight th{padding:8px 14px}
.cards.mk .card{padding:18px 20px;gap:8px}.cards.mk .card b{font-size:26px}.cards.mk .card span{font-size:20.5px}.cards.mk .card .lim{font-size:19px}
.tb tr.on td{background:#ffe9d6}
.tb tr.on td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.tb td.on{background:#fff1e4;color:#9a4a0c;font-weight:700}
.tb th.me{background:var(--deep)}
.tb td.me{background:#fff4ec}
.tb.mx td{text-align:center;padding:9px 8px}
.tb.mx td:first-child{text-align:left;font-weight:700;font-size:21px;padding-left:16px}
.tb.mx th{text-align:center}.tb.mx th:first-child{text-align:left;padding-left:16px}
.sy{display:block;font-size:29px;line-height:1.05;font-weight:700}
.sy small{display:block;font-size:15.5px;font-weight:400;color:var(--muted);margin-top:3px;line-height:1.25}
.sy.o{color:var(--ink)}.sy.t{color:#b07a1a}.sy.x{color:#a0a8b0}.sy.d{color:#b9bfc5}
td.me .sy{color:var(--accent)}td.me .sy small{color:var(--deep);font-weight:700}

/* 封面 */
.cv-k{font-size:17px;letter-spacing:.16em;color:var(--deep);font-weight:500}
.cv h1{font-size:62px;font-weight:900;line-height:1.2;margin-top:22px}
.cv h1 em{font-style:normal;color:var(--accent)}
.cv .s{font-size:26px;color:#46535e;margin-top:22px;line-height:1.6}
.cv .a{font-size:20px;color:#3b4853;margin-top:26px;line-height:1.7}
.howto{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px}
.howto span{font-size:15px;color:#46535e;border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:6px;padding:6px 11px}
.howto b{color:var(--accent);margin-right:6px}
.recap{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.recap div{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:baseline;font-size:21px;line-height:1.5;color:#33414c}
.recap i{font-style:normal;font-size:16px;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:3px 0;text-align:center}

/* ---------- 參數面板 ---------- */
#param{display:flex;flex-direction:column;gap:8px}
#ro{display:flex;gap:10px}
#ro:empty{display:none}
#ro .r{flex:1;min-width:0;border-right:1px solid #e6e1d7;padding-right:8px}
#ro .r:last-child{border-right:0}
#ro .l{font-size:13px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ro .v{font-family:var(--mono);font-size:22px;font-weight:500;color:#1d2a35;line-height:1.2;white-space:nowrap}
#ro .v small{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
#ro .r.hi .v{color:var(--accent);font-weight:700}
#pc{font-size:17px;line-height:1.55;color:#33414c;flex:1;min-height:0}
#pc b{color:var(--blue)}
#pc .ci{font-size:inherit;line-height:inherit;gap:6px;animation:none}
#pc .lg{display:flex;flex-wrap:wrap;gap:4px 18px}
#pc .lg span{display:flex;align-items:center;gap:8px}
#pc .lg i{display:inline-block;width:24px;height:10px;border-radius:3px}
.tgrad{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:15px;color:var(--muted)}
.tgrad i{height:12px;border-radius:3px;background:linear-gradient(90deg,#2f7dc0,#c9c2bd,#e5702e)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px}
.pgrid div{border-left:3px solid var(--accent);padding-left:9px}
.pgrid small{display:block;font-size:13px;color:var(--muted)}
.pgrid b{font-family:var(--mono);font-size:18px;color:var(--ink)!important;white-space:nowrap}
#mbtn{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;gap:6px}
#mbtn button{font:inherit;font-size:14px;border:1px solid #c9c2b5;background:rgba(255,255,255,.94);color:#22303b;border-radius:6px;padding:5px 11px;cursor:pointer}
#mbtn button:hover{border-color:var(--accent)}
#mbtn button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#ctrl{display:none}

/* ---------- 標籤 ---------- */
.tag{position:absolute;background:rgba(255,255,255,.96);border:1px solid #9aa6b0;border-radius:3px;padding:3px 8px;font-size:14.5px;line-height:1.35;color:#1d2a35;white-space:nowrap;transition:opacity .35s;box-shadow:0 2px 8px rgba(22,34,46,.08)}
.tag small{display:block;font-size:12px;color:#5b6772}
.tag.hot{border-color:var(--accent);color:#9a4a0c}
.tag.cold{border-color:var(--cold);color:#1d5b93}

/* ---------- 進度路線 ---------- */
#route{position:absolute;left:0;right:0;top:834px;height:66px;z-index:4;pointer-events:none}
#route .ln{position:absolute;left:80px;right:80px;top:30px;height:2px;background:#cfc9bd}
#route .prog{position:absolute;left:80px;top:30px;height:2px;background:var(--accent);transition:width .6s}
#route .st{position:absolute;top:20px;transform:translateX(-50%);text-align:center}
#route .st b{display:block;width:21px;height:21px;line-height:17px;border-radius:50%;background:#fff;border:2px solid #a9a295;margin:0 auto;font-size:11.5px;font-weight:700;font-family:var(--mono);color:#6b7480}
#route .st span{position:absolute;left:50%;top:25px;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:#7d8790}
#route .st.past b{background:#efb48c;border-color:#efb48c;color:#7a3d12}
#route .st.cur b{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px rgba(232,114,44,.18)}
#route .st.cur span{color:var(--accent);font-weight:700;font-size:14px}
#route .st.wait span{visibility:hidden}

#tools{position:absolute;right:20px;top:848px;z-index:7;display:flex;gap:6px}
#tools button{border:1px solid #c9c2b5;background:rgba(255,255,255,.92);border-radius:6px;width:32px;height:28px;cursor:pointer;font-size:15px;color:#33414c}
#tools button:hover{border-color:var(--accent)}
#fade{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:20;transition:opacity .22s}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:40;background:var(--bg);font-size:22px;color:#7a2f12;text-align:center;line-height:1.8}
#stage.notr .box,#stage.notr [data-s]{transition:none!important}
#stage.notr .ci{animation:none!important}

/* 章節帶入 */
#chap{position:absolute;inset:0;z-index:30;display:none;pointer-events:none}
#chap .bg{position:absolute;inset:0;background:var(--bg);opacity:0;transition:opacity .45s}
#chap .ck{position:absolute;left:0;right:0;top:322px;text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.35em;color:var(--accent);opacity:0;transition:opacity .35s}
#chap .cl{position:absolute;left:640px;width:320px;top:560px;height:4px;border-radius:2px;background:var(--accent);transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .3s}
#chap .cn{position:absolute;left:800px;top:450px;font-size:112px;font-weight:900;letter-spacing:.04em;color:var(--ink);white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(1.06);transition:transform .45s ease-out,opacity .45s}
#chap.in .bg{opacity:1}#chap.in .ck{opacity:1}#chap.in .cl{transform:scaleX(1)}#chap.in .cn{opacity:1;transform:translate(-50%,-50%) scale(1)}
#chap.fly .bg{opacity:0;transition:opacity .6s}#chap.fly .ck,#chap.fly .cl{opacity:0}
#chap.fly .cn{transition:transform .75s cubic-bezier(.65,0,.25,1),color .75s}

/* 請求項 */
.claim{background:#fcfbf8;border:1.5px solid #e1dbcf;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.claim p{font-size:19px;line-height:1.55;color:#2f3c47;border-radius:6px;padding:2px 8px;transition:background .35s,color .35s,box-shadow .35s}
.claim p.el{margin-left:30px}
.claim p.pre{font-weight:700;color:var(--ink)}
.claim p.on{background:#fff1e4;box-shadow:inset 4px 0 0 var(--accent);color:#1d2a35}
.claim .hl{color:var(--deep);font-weight:700}
.claim u{text-decoration:none;border-bottom:2px solid var(--accent)}
.anat{display:flex;gap:8px;align-items:center;font-size:17.5px;color:#33414c;flex-wrap:wrap}
.anat i{font-style:normal;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:3px 12px}
.anat i.a{background:var(--deep)}

/* 流程圖 */
.flow{position:relative;height:345px}
.flow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fx{position:absolute;width:176px;height:90px;border:2px solid #b9b2a5;background:#fff;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;transition:background .25s,border-color .25s,box-shadow .25s,transform .25s}
.fx b{font-family:var(--mono);font-size:15px;color:var(--deep)}
.fx span{font-size:16.5px;line-height:1.3;color:#22303b}
.fx.q{border-color:#e7a37a;border-style:solid}
.fx.live{background:#fff1e4;border-color:var(--accent);box-shadow:0 0 0 5px rgba(232,114,44,.2);transform:scale(1.04)}
.fl{font-size:15px;fill:#5d6873;font-weight:700}
.fa{fill:none;stroke:#7d8790;stroke-width:2}
.th2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.th2 div{background:#fcfbf8;border:1.5px solid #e1dbcf;border-radius:10px;padding:10px 16px;font-size:18px;line-height:1.5;color:#3b4853}
.th2 b{display:block;font-size:21px;color:var(--ink)}
.th2 .pm{font-size:20px}

/* 預期功效 */
.eff{display:flex;flex-direction:column;gap:14px}
.eff div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-size:22px;line-height:1.45;color:#26333e}
.eff i{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent);font-style:normal;font-size:16px;font-weight:900}

/* =====================================================================
   場景：龍門（示意，比例大致參考論文 COMSOL 模型；單位 1 = 100 mm，z 朝上，正面朝 −y）

   ===================================================================== */
const XC = 8.25, ZB = 17.5, HB = 17;
/* 變形示意（大幅放大）：上熱 → 橫樑伸長並上拱，立柱頂端被往外推 */
function deform(x, y, z, a) {

const GA = new THREE.Color('#2f7dc0'), GM = new THREE.Color('#cfc8c2'), GB = new THREE.Color('#ee6c22'), STEEL = new THREE.Color('#c3cad0');
const tc = new THREE.Color(), tc2 = new THREE.Color();

function applyDeform(S) {

function simReset(S) { S.sim = { Tu: 23.40, Tl: 22.90, on: false, acc: 0, hist: [], sw: 0, phase: 'S1', held: 0, chk: 0, cyc: 0, ht: 0, qU: .3, qL: .3 }; S.pcache = ''; }

function prep(S) {
  if (S.ready) return;
  if (S.scene) {
    const sc = SCENES[S.scene](S.sopt || {}); S.sc = sc;
    S.params = { ...(sc.params || {}), ...(S.params || {}) };
    S.labels = { ...(sc.labels || {}), ...(S.labels || {}) };
    S.camScale = S.camScale || sc.camScale || 1;
    S.ro = S.ro || sc.ro; S.controls = S.controls || sc.controls;
    init3d(S); sc.build(S);
    for (const g of S.egs) { S.ex[g] = 0; S.exT[g] = 0; }
  } else S.params = { ...(S.params || {}) };
  S.target = { ...S.params }; S.defaults = { ...S.params };
  S.ready = true;
}

const SHOT = location.search.includes('shot');
function flyTo(pos, tgt, dur, jump) {
  if (SHOT) { dur = .01; jump = false; }
  if (jump) {
    const o = V3(pos).sub(V3(tgt)); o.applyAxisAngle(new THREE.Vector3(0, 0, 1), -0.5).multiplyScalar(1.4);
    camera.position.copy(V3(tgt).add(o)); controls.target.copy(V3(tgt));
  }
  tw.p0 = camera.position.clone(); tw.t0 = controls.target.clone(); tw.p1 = V3(pos); tw.t1 = V3(tgt);
  tw.k = 0; tw.d = dur; tw.active = true; controls.enabled = false;
}
function stepTween(dt) {
  if (!tw.active) return;
  tw.k = Math.min(1, tw.k + dt / tw.d); const e = ease(tw.k);
  const t = tw.t0.clone().lerp(tw.t1, e), o0 = tw.p0.clone().sub(tw.t0), o1 = tw.p1.clone().sub(tw.t1);
  const r = THREE.MathUtils.lerp(o0.length(), o1.length(), e);
  const q = new THREE.Quaternion().setFromUnitVectors(o0.clone().normalize(), o1.clone().normalize());
  const dir = o0.normalize().applyQuaternion(new THREE.Quaternion().slerp(q, e));
  camera.position.copy(t).addScaledVector(dir, r); controls.target.copy(t); camera.lookAt(t);
  if (tw.k >= 1) { tw.active = false; controls.enabled = true; controls.update(); }
}

function setParam(S, k, v, snap) {
  if (S.sc && S.sc.discrete && S.sc.discrete.includes(k)) snap = true;
  if (typeof v === 'number' && typeof S.params[k] === 'number' && !snap) S.target[k] = v;
  else { const old = S.params[k]; S.params[k] = v; S.target[k] = v; if (old !== v && S.sc && S.sc.onParam) S.sc.onParam(S, k, v, old); }
}
function camPos(S, st) { const k = S.camScale || 1; return st.cam.map((v, i) => st.tgt[i] + (v - st.tgt[i]) * k); }

/* 內容：同一頁內以 data-s 逐步顯現，或以 step.c 整段替換 */
function pick(S, i, key, def) { for (let j = i; j >= 0; j--) { const st = S.steps[j]; if (st && st[key] !== undefined) return [st[key], key + j]; } return [def || '', key + 'd']; }
function inRange(spec, i) { return String(spec).split(',').some(r => { const [a, b] = r.split('-').map(Number); return b === undefined ? i === a : i >= a && i <= b; }); }
function reveal(root, i) {
  if (!root) return;
  root.querySelectorAll('[data-s]').forEach(e => e.classList.toggle('vis', i >= +e.dataset.s));
  root.querySelectorAll('[data-on]').forEach(e => e.classList.toggle('on', inRange(e.dataset.on, i)));
}
function fill(box, S, i, key, def) {
  const [html, id] = pick(S, i, key, def);
  if (box.dataset.id !== S.id + id) {
    box.dataset.id = S.id + id;
    box.innerHTML = `<div class="ci">${typeof html === 'function' ? html(S) : html}</div>`;
    const ci = box.firstChild; requestAnimationFrame(() => requestAnimationFrame(() => reveal(ci, S.step)));
    if (S.sim) S.sim.lastPh = null;
  } else reveal(box.firstChild, i);
}
function setLayout(cls) { stage.classList.remove('L-model', 'L-wide', 'L-flat', 'L-cover'); stage.classList.add(cls); }

function applyStep(S, i, jump) {
  S.step = i; const st = S.steps[i] || {};
  const set = { ...S.defaults, ...(st.set || {}) };
  for (const k in set) setParam(S, k, set[k], st.snap || jump);
  setLayout(S.kind === 'model' ? (st.wide ? 'L-wide' : 'L-model') : S.kind === 'cover' ? 'L-cover' : 'L-flat');
  fill($('content'), S, i, 'c', S.content);
  const pc = $('pc'); fill(pc, S, i, 'p', S.param); pc.dataset.dyn = '';
  if (S.scene) {
    for (const g of S.egs) S.exT[g] = 0;
    for (const n in S.parts) { const p = S.parts[n]; p.visT = st.focus ? (match(n, st.focus) ? 1 : 0.06) : 1; p.hotT = st.hot && match(n, st.hot) ? 1 : 0; }
    if (st.cam) flyTo(camPos(S, st), st.tgt, st.dur || 1.6, jump);
    controls.autoRotate = !!st.spin;
    makeLabels(S, (st.lab || []).map(id => S.labels[id]).filter(Boolean));
  } else { makeLabels(S, []); controls.autoRotate = false; }
  $('sayno').textContent = `${i + 1} / ${S.steps.length}`;
  const tx = $('saytx'); tx.style.opacity = 0; setTimeout(() => { tx.innerHTML = st.say || ''; tx.style.opacity = 1; }, 140);
  $('dots').innerHTML = S.steps.length > 1 ? S.steps.map((_, k) => `<b class="${k === i ? 'on' : k < i ? 'done' : ''}"></b>`).join('') : '';
}

/* 標籤（引線＋白框） */
let LB = [];
function makeLabels(S, specs) {
  const lay = $('lbl'), svg = $('lsvg');
  LB.forEach(l => { l.el.remove(); l.ln.remove(); l.dot.remove(); }); LB = [];
  specs.forEach((sp, i) => {
    const el = document.createElement('div'); el.className = 'tag' + (sp.hot ? ' hot' : sp.cold ? ' cold' : '');
    el.innerHTML = sp.t + (sp.s ? `<small>${sp.s}</small>` : ''); el.style.opacity = 0; lay.appendChild(el);
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('stroke', '#6d7a86'); ln.setAttribute('stroke-width', '1.2');
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); dot.setAttribute('r', '3.5'); dot.setAttribute('fill', '#e8722c');
    svg.appendChild(ln); svg.appendChild(dot);
    LB.push({ sp, el, ln, dot, born: performance.now() + 650 + i * 130 });
  });
}
const tmpV = new THREE.Vector3();
function updateLabels(S) {
  const now = performance.now();
  for (const L of LB) {
    const p = S.parts[L.sp.p]; if (!p) continue;
    const at = typeof L.sp.at === 'function' ? L.sp.at(S) : L.sp.at;
    tmpV.set(...at); p.root.localToWorld(tmpV); tmpV.project(camera);
    const x = (tmpV.x + 1) / 2 * VW, y = (1 - tmpV.y) / 2 * VH, ok = tmpV.z < 1 && now > L.born;
    const bx = x + L.sp.dx, by = y + L.sp.dy, w = L.el.offsetWidth, h = L.el.offsetHeight;
    let lx = L.sp.dx < 0 ? bx - w : bx; lx = clamp(lx, 4, VW - w - 4); const ty = clamp(by - h / 2, 4, VH - h - 4);
    L.el.style.left = lx + 'px'; L.el.style.top = ty + 'px'; L.el.style.opacity = ok ? 1 : 0;
    L.ln.setAttribute('x1', x); L.ln.setAttribute('y1', y); L.ln.setAttribute('x2', L.sp.dx < 0 ? lx + w : lx); L.ln.setAttribute('y2', ty + h / 2);
    L.ln.style.opacity = L.dot.style.opacity = ok ? 1 : 0; L.dot.setAttribute('cx', x); L.dot.setAttribute('cy', y);
  }
}

/* 參數面板：讀數；控制按鈕放在模型框右上 */
function buildUI(S) {
  const c = $('mbtn'); c.innerHTML = ''; S.ui = [];
  for (const d of (S.controls || [])) {
    if (d.type === 'seg') d.opts.forEach(([v, t]) => {
      const b = document.createElement('button'); b.textContent = t; b.onclick = () => setParam(S, d.key, v, true); c.appendChild(b);
      S.ui.push(() => b.classList.toggle('on', S.params[d.key] === v));
    });
    else if (d.type === 'btn') { const b = document.createElement('button'); b.textContent = d.label; b.onclick = () => d.fn(S); c.appendChild(b); }
  }
  const ro = $('ro'); ro.innerHTML = ''; S.roEl = [];
  for (const r of (S.ro || [])) {
    const d = document.createElement('div'); d.className = 'r' + (r.hi ? ' hi' : ''); if (r.w) d.style.flex = r.w;
    d.innerHTML = `<div class="l">${r.l}</div><div class="v"><span></span><small>${r.u || ''}</small></div>`;
    ro.appendChild(d); S.roEl.push([d.querySelector('span'), r.f]);
  }
  $('mtag').innerHTML = S.scene && !S.noTag ? '<b>此模型為示意</b>' : '';
}

function drawRoute(S) {
  const r = $('route'), st = DECK.stations; r.innerHTML = '<div class="ln"></div><div class="prog"></div>';
  const x0 = 150, x1 = W - 190, cur = S.st ?? -1;
  st.forEach((s, i) => {
    const x = x0 + (x1 - x0) * i / (st.length - 1);
    const d = document.createElement('div'); d.className = 'st' + (i === cur ? ' cur' : i < cur ? ' past' : '');
    d.style.left = x + 'px'; d.innerHTML = `<b>${i ? String(i).padStart(2, '0') : ''}</b><span>${s}</span>`; r.appendChild(d);
  });
  r.querySelector('.prog').style.width = cur >= 0 ? (x0 - 80 + (x1 - x0) * cur / (st.length - 1)) + 'px' : '0px';
}

/* 章節帶入：大字置中 → 約 1 秒後縮小飛到下方進度條 */
const chapEl = document.createElement('div'); chapEl.id = 'chap';
chapEl.innerHTML = '<div class="bg"></div><div class="ck"></div><div class="cn"></div><div class="cl"></div>';
stage.appendChild(chapEl);
let chapT = [];
function chapEnd() {
  chapT.forEach(clearTimeout); chapT = [];
  chapEl.className = ''; chapEl.style.display = 'none';
  const w = document.querySelector('#route .st.wait'); if (w) w.classList.remove('wait');
}
function chapIntro(i) {
  chapEnd();
  const cn = chapEl.querySelector('.cn');
  chapEl.querySelector('.ck').textContent = 'CHAPTER ' + String(i).padStart(2, '0');
  cn.textContent = DECK.stations[i]; cn.style.transform = ''; cn.style.color = '';
  chapEl.style.display = 'block'; void chapEl.offsetWidth; chapEl.classList.add('in');
  chapT.push(setTimeout(() => {
    const sp = document.querySelectorAll('#route .st')[i]; if (!sp) return chapEnd();
    sp.classList.add('wait');
    const k = stage.getBoundingClientRect().width / W;
    const t = sp.querySelector('span').getBoundingClientRect(), c = cn.getBoundingClientRect();
    const dx = ((t.left + t.width / 2) - (c.left + c.width / 2)) / k, dy = ((t.top + t.height / 2) - (c.top + c.height / 2)) / k;
    chapEl.classList.add('fly');
    cn.style.transform = `translate(${dx}px, ${dy}px) translate(-50%,-50%) scale(${t.width / c.width})`;
    cn.style.color = getComputedStyle(sp.querySelector('span')).color;
    chapT.push(setTimeout(chapEnd, 800));
  }, 1250));
}

function goSlide(n, atEnd, stepAt) {
  if (n < 0 || n >= SLIDES.length) return;
  const prevSt = cur ? cur.st : null, nst = SLIDES[n].st;
  if (!SHOT && cur && n > curI && nst !== prevSt && nst > 0) chapIntro(nst); else chapEnd();
  const fade = $('fade'); fade.style.opacity = 1;
  setTimeout(() => {
    const S = SLIDES[n]; prep(S); cur = S; curI = n;
    if (S.sc && S.sc.enter) S.sc.enter(S);
    $('kick').textContent = S.kick || ''; $('ttl').textContent = S.title || '';
    $('pgb').textContent = `${n + 1} / ${SLIDES.length}`;
    glc.style.visibility = S.scene ? 'visible' : 'hidden'; $('say').style.visibility = S.noSay ? 'hidden' : 'visible';
    buildUI(S); drawRoute(S);
    applyStep(S, stepAt !== undefined ? Math.min(stepAt, S.steps.length - 1) : (atEnd ? S.steps.length - 1 : 0), true);
    try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) { }
    fade.style.opacity = 0;
    if (SHOT) { for (let k = 0; k < 160; k++) frame(.05); LB.forEach(l => l.born = 0); frame(.05); }
  }, 220);
}
function next() { if (!cur) return; if (chapEl.style.display === 'block') { chapEnd(); return; } if (cur.step < cur.steps.length - 1) applyStep(cur, cur.step + 1); else goSlide(curI + 1); }
function prev() { if (!cur) return; if (cur.step > 0) applyStep(cur, cur.step - 1); else goSlide(curI - 1, true); }

/* 輸入 */
let down = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('.ui')) { down = null; return; } down = { x: e.clientX, y: e.clientY }; });
stage.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6; down = null;
  if (moved || e.target.closest('.ui')) return;
  if (e.button === 0) next(); else if (e.button === 2) prev();
});
stage.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  const k = e.key;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown') { e.preventDefault(); goSlide(curI + 1); }
  else if (k === 'ArrowUp') { e.preventDefault(); goSlide(curI - 1); }
  else if (k === 'Home') goSlide(0); else if (k === 'End') goSlide(SLIDES.length - 1);
  else if (k === 'z' || k === 'Z' || k === '0') goSlide(0);
  else if (/^[1-7]$/.test(k)) { const t = SLIDES.findIndex(s => s.st === +k); if (t >= 0) goSlide(t); }
  else if (k === 'f' || k === 'F') fs();
  else if ((k === 'r' || k === 'R') && cur && cur.scene) { const st = cur.steps[cur.step]; if (st.cam) flyTo(camPos(cur, st), st.tgt, 1.2); }
});
function fs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => { }); else document.exitFullscreen().catch(() => { }); }
$('bPrev').onclick = prev; $('bNext').onclick = next; $('bFs').onclick = fs;

/* 主迴圈 */
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; frame(dt); requestAnimationFrame(loop); }
function frame(dt) {
  const S = cur; if (!S) return;
  for (const k in S.target) {
    const v = S.target[k];
    if (typeof v === 'number' && typeof S.params[k] === 'number') { S.params[k] += (v - S.params[k]) * Math.min(1, dt * 2.6); if (Math.abs(v - S.params[k]) < 1e-4) S.params[k] = v; }
  }
  if (S.scene) {
    S.sc.update(S, dt);
    for (const n in S.parts) {
      const p = S.parts[n]; p.vis += (p.visT - p.vis) * Math.min(1, dt * 4); p.hot += (p.hotT - p.hot) * Math.min(1, dt * 5);
      p.root.position.copy(p.base);
      p.root.visible = (p.alpha ?? 1) > .02 && p.vis > .07;
      const v = .05 + .95 * p.vis * (p.alpha ?? 1), pulse = p.hot * (.75 + .25 * Math.sin(performance.now() / 260));
      for (const r of p.mats) {
        if (r.fill) {
          r.fill.opacity = r.op * v;
          if (!r.keepColor) { r.fill.color.copy(r.base); r.fill.emissive.copy(r.base).multiplyScalar(pulse * (r.glow ?? .45)); }
          r.fill.depthWrite = !r.noDepth && p.vis > .5 && (p.alpha ?? 1) > .5;
        }
        if (r.line) { r.line.opacity = r.lop * v; r.line.color.copy(r.lbase).lerp(HOTE, p.hot); }
      }
    }
    stepTween(dt); if (!tw.active) controls.update();
    if (sizeView()) { renderer.render(S.scene3, camera); updateLabels(S); }
    if (S.sc.panel && !pick(S, S.step, 'p', S.param)[0]) {
      const pc = $('pc'), h = S.sc.panel(S); if (pc.dataset.dyn !== h) { pc.dataset.dyn = h; pc.innerHTML = h; }
    }
  }
  if (S.roEl) for (const [el, f] of S.roEl) el.textContent = f(S);
  if (S.ui) for (const u of S.ui) u();
}

fit();
if (SHOT) stage.classList.add('notr');
let start = 0, startStep;
try { const m = location.hash.slice(1).split('-'); const h = parseInt(m[0], 10); if (h >= 1 && h <= SLIDES.length) start = h - 1; if (m[1]) startStep = parseInt(m[1], 10) - 1; } catch (e) { }
goSlide(start, false, startStep);
requestAnimationFrame(loop);
window.__deck = {
  goSlide, next, prev, get cur() { return cur; }, get i() { return curI; },
  go(n, st) { return new Promise(r => { goSlide(n, false, st); setTimeout(() => { for (let i = 0; i < 90; i++) frame(1 / 30); LB.forEach(l => l.born = 0); frame(1 / 30); r('ok'); }, 300); }); }
};
</script>
